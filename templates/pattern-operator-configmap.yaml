apiVersion: v1
kind: ConfigMap
metadata:
  name: patterns-operator-config
  namespace: {{ .Values.main.patternsOperator.subscriptionNamespace }}
data:
  gitops.catalogSource: {{ .Values.main.gitops.operatorSource }}
  gitops.channel: {{ .Values.main.gitops.channel }}
  gitea.chartName: {{ .Values.main.gitea.chartName }}
  gitea.helmRepoUrl: {{ .Values.main.gitea.helmRepoUrl }}
  gitea.chartVersion: {{ .Values.main.gitea.chartVersion }}
  analytics.enabled: {{ .Values.main.analytics.enabled | quote }}
  {{- if .Values.main.gitops.additionalArgoAdmins }}
  gitops.additionalArgoAdmins: {{ .Values.main.gitops.additionalArgoAdmins }}
  {{- end }}
  {{- if .Values.main.gitops.argoRBAC }}
  gitops.argoRBAC: |
{{ .Values.main.gitops.argoRBAC | indent 4 }}
  {{- end }}
  {{- if .Values.main.gitops.customArgoYaml }}
  gitops.customArgoYaml: |
{{ .Values.main.gitops.customArgoYaml | indent 4 }}
  {{- end }}
  {{- if .Values.main.gitops.applicationHealthCheckEnabled }}
  gitops.applicationHealthCheckEnabled: {{ .Values.main.gitops.applicationHealthCheckEnabled | quote }}
  {{- end }}
  {{- if .Values.main.gitops.customHealthChecks }}
  gitops.customHealthChecks: |
{{ .Values.main.gitops.customHealthChecks | indent 4 }}
  {{- end }}
  {{- if .Values.main.gitops.sourceNamespace }}
  gitops.sourceNamespace: {{ .Values.main.gitops.sourceNamespace }}
  {{- end }}
  {{- if .Values.main.gitops.installApprovalPlan }}
  gitops.installApprovalPlan: {{ .Values.main.gitops.installApprovalPlan }}
  {{- end }}
  {{- if .Values.main.gitops.csv }}
  gitops.csv: {{ .Values.main.gitops.csv }}
  {{- end }}

  # gitops.ManualSync: GitOpsDefaultManualSync
  # gitops.name: GitOpsDefaultPackageName
